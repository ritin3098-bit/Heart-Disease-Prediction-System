{% extends 'base.html' %}

{% block content %}

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow">
                <div class="card-body p-5">
                    <h1 class="mb-4">{% block page_title %}{% endblock %}</h1>

            </div>
        </div>
    </div>
</div>
{% endblock %}
